<style>

<script>
        // Decorative Terminal Log Script
        const logs = [
            "INIT SYNC protocol... OK",
            "Checking encryption keys...",
            "RSA-4096 signature VERIFIED",
            "Establishing secure tunnel via node [44.192.x.x]",
            "Awaiting user credentials...",
            "WARNING: Unauthorized access will be logged.",
            "Radar sweep active. Monitoring sector 7G.",
            "Database connection: STABLE",
            "Memory integrity: 100%"
        ];

        const logContainer = document.getElementById('terminal-log');
        let logIndex = 0;

        function addLog() {
            if (logIndex < logs.length && logContainer) {
                const el = document.createElement('div');
                el.textContent = `> ${logs[logIndex]}`;
                el.className = "opacity-0 transition-opacity duration-300";
                logContainer.appendChild(el);
                
                // Trigger reflow and fade in
                setTimeout(() => el.classList.remove('opacity-0'), 50);
                
                // Keep only last 8 logs
                if (logContainer.children.length > 8) {
                    logContainer.removeChild(logContainer.firstChild);
                }
                
                logIndex++;
                setTimeout(addLog, Math.random() * 1500 + 500);
            }
        }
        
        setTimeout(addLog, 1000);

        // Simulated Authentication Interaction
        function initiateHandshake() {
            const btn = document.getElementById('auth-btn');
            
            btn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">refresh</span> VERIFYING HASH...`;
            btn.classList.remove('bg-primary-container', 'text-on-primary-container');
            btn.classList.add('bg-surface-variant', 'text-primary-container', 'border-primary-container', 'animate-pulse');
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">lock_open</span> ACCESS GRANTED`;
                btn.classList.remove('bg-surface-variant', 'text-primary-container', 'border-primary-container', 'animate-pulse');
                btn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_0_20px_rgba(219,252,255,0.6)]');
                
                // REDIRECT LOGIC: Access Granted ke 1 second baad Command page par bhej dega
                setTimeout(() => {
                    window.location.href = "/command";
                }, 1000);
                
            }, 2000);
        }
    </script>
